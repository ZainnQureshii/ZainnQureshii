<svg xmlns="http://www.w3.org/2000/svg" width="360" height="270" viewBox="0 0 360 270" role="img" aria-labelledby="title">
  <title id="title">Name the barrier. Agents implement below it. Verify before believing. Ship something that runs without me.</title>
  <defs>
    <style>
      /* Hallmark: technical composition with a visible human judgment boundary. */
      :root {
      --ink: #edf2fa;
      --muted: #b3c2d5;
      --paper: #111e30;
      --panel: #1a2b42;
      --line: #53677f;
      --accent: #e6a775;
      --navy: #111e30;
      --white: #edf2fa;
      --pale: #b3c2d5;
      --copper: #e6a775;
        --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        --font-display: Georgia, 'Times New Roman', serif;
      }
      text { font-family: var(--font-body); fill: var(--ink); }
      .display { font-family: var(--font-display); }
      .muted { fill: var(--muted); }
      .accent { fill: var(--accent); }
      .paper { fill: var(--paper); }
      .panel { fill: var(--panel); }
      .navy { fill: var(--navy); }
      .white { fill: var(--white); }
      .pale { fill: var(--pale); }
      .copper { fill: var(--copper); }
      .rule { fill: none; stroke: var(--line); stroke-width: 1; }
      .signal { fill: none; stroke: var(--accent); stroke-width: 2; }
      .bright { fill: none; stroke: var(--copper); stroke-width: 2; }
    </style>
  </defs>
  <rect x="0" y="0" width="360" height="270" class="navy"/>
  <path d="M40 40V222" class="bright"/>
  <rect x="25" y="27" width="30" height="28" class="navy"/>
  <text x="31" y="48" font-size="22" class="copper" font-weight="600">1</text>
  <text x="68" y="47" font-size="18" class="white">Name the barrier</text>
  <rect x="25" y="86" width="30" height="28" class="navy"/>
  <text x="31" y="107" font-size="22" class="copper" font-weight="600">2</text>
  <text x="68" y="106" font-size="18" class="white">Agents implement</text>
  <text x="68" y="128" font-size="18" class="white">below it</text>
  <rect x="25" y="145" width="30" height="28" class="navy"/>
  <text x="31" y="166" font-size="22" class="copper" font-weight="600">3</text>
  <text x="68" y="165" font-size="18" class="white">Verify before believing</text>
  <rect x="25" y="204" width="30" height="28" class="navy"/>
  <text x="31" y="225" font-size="22" class="copper" font-weight="600">4</text>
  <text x="68" y="224" font-size="18" class="white">Ship something that</text>
  <text x="68" y="246" font-size="18" class="white">runs without me</text>
</svg>
