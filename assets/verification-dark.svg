<svg xmlns="http://www.w3.org/2000/svg" width="840" height="104" viewBox="0 0 840 104" role="img" aria-labelledby="title">
  <title id="title">Playwright, Chrome DevTools Protocol, deterministic hooks, tracing, circuit breakers</title>
  <defs>
    <style>
      /* Hallmark: technical composition with a visible human judgment boundary. */
      :root {
      --ink: #edf2fa;
      --muted: #b3c2d5;
      --paper: #111e30;
      --panel: #1a2b42;
      --line: #53677f;
      --accent: #e6a775;
      --navy: #111e30;
      --white: #edf2fa;
      --pale: #b3c2d5;
      --copper: #e6a775;
        --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        --font-display: Georgia, 'Times New Roman', serif;
      }
      text { font-family: var(--font-body); fill: var(--ink); }
      .display { font-family: var(--font-display); }
      .muted { fill: var(--muted); }
      .accent { fill: var(--accent); }
      .paper { fill: var(--paper); }
      .panel { fill: var(--panel); }
      .navy { fill: var(--navy); }
      .white { fill: var(--white); }
      .pale { fill: var(--pale); }
      .copper { fill: var(--copper); }
      .rule { fill: none; stroke: var(--line); stroke-width: 1; }
      .signal { fill: none; stroke: var(--accent); stroke-width: 2; }
      .bright { fill: none; stroke: var(--copper); stroke-width: 2; }
    </style>
  </defs>
  <rect x="0" y="0" width="840" height="104" class="paper"/>
  <rect x="0" y="0" width="4" height="104" class="accent"/>
  <text x="24" y="44" font-size="30" font-weight="600">Playwright</text>
  <text x="24" y="79" font-size="19" class="muted">Chrome DevTools Protocol</text>
  <path d="M356 20V84" class="rule"/>
  <text x="384" y="43" font-size="22">deterministic hooks</text>
  <text x="384" y="79" font-size="19" class="muted">tracing</text>
  <text x="528" y="79" font-size="19" class="muted">circuit breakers</text>
</svg>
