<svg xmlns="http://www.w3.org/2000/svg" width="840" height="104" viewBox="0 0 840 104" role="img" aria-labelledby="title">
  <title id="title">Angular, TypeScript, JavaScript, NX, RxJS, React, Electron, HTML, CSS</title>
  <defs>
    <style>
      /* Hallmark: technical composition with a visible human judgment boundary. */
      :root {
      --ink: #172b46;
      --muted: #495e78;
      --paper: #eef3fa;
      --panel: #e2eaf5;
      --line: #b1c0d2;
      --accent: #99512c;
      --navy: #111e30;
      --white: #edf2fa;
      --pale: #b3c2d5;
      --copper: #e6a775;
        --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        --font-display: Georgia, 'Times New Roman', serif;
      }
      text { font-family: var(--font-body); fill: var(--ink); }
      .display { font-family: var(--font-display); }
      .muted { fill: var(--muted); }
      .accent { fill: var(--accent); }
      .paper { fill: var(--paper); }
      .panel { fill: var(--panel); }
      .navy { fill: var(--navy); }
      .white { fill: var(--white); }
      .pale { fill: var(--pale); }
      .copper { fill: var(--copper); }
      .rule { fill: none; stroke: var(--line); stroke-width: 1; }
      .signal { fill: none; stroke: var(--accent); stroke-width: 2; }
      .bright { fill: none; stroke: var(--copper); stroke-width: 2; }
    </style>
  </defs>
  <rect x="0" y="0" width="840" height="104" class="paper"/>
  <rect x="0" y="0" width="4" height="104" class="accent"/>
  <text x="24" y="45" font-size="30" font-weight="600">Angular</text>
  <text x="24" y="80" font-size="26" font-weight="600">TypeScript</text>
  <path d="M242 20V84" class="rule"/>
  <text x="272" y="43" font-size="19" class="muted">JavaScript</text>
  <text x="418" y="43" font-size="19" class="muted">NX</text>
  <text x="487" y="43" font-size="19" class="muted">RxJS</text>
  <text x="272" y="79" font-size="19" class="muted">React</text>
  <text x="382" y="79" font-size="19" class="muted">Electron</text>
  <text x="524" y="79" font-size="19" class="muted">HTML</text>
  <text x="632" y="79" font-size="19" class="muted">CSS</text>
</svg>
