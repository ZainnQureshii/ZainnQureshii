  <title id="title">Zain Qureshi. Agentic AI engineer. Engineering since 2019.</title>
  <desc id="description">A custom geometric wordmark in cream on a dark violet field, with a quiet teal and violet schematic rule.</desc>
  <style>
    .name { fill: #fff5db; fill-rule: evenodd; }
    .subtitle { fill: #fff5db; font-family: Arial, Helvetica, sans-serif; font-size: 23px; letter-spacing: 2px; }
    .compact { display: none; }
    .arrival { animation: settle 1800ms ease-out 1 both; }
    @keyframes settle { from { opacity: .2; } to { opacity: 1; } }
    @media (max-width: 600px) {
      .desktop { display: none; }
      .compact { display: inline; }
      .subtitle { font-size: 32px; letter-spacing: 2px; }
    }
    @media (prefers-reduced-motion: reduce) { .arrival { animation: none; } }
  </style>
