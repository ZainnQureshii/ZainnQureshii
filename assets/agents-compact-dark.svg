<svg xmlns="http://www.w3.org/2000/svg" width="360" height="160" viewBox="0 0 360 160" role="img" aria-labelledby="title">
  <title id="title">Claude Code, Codex CLI, MCP, Copilot, multi-agent orchestration, model routing</title>
  <defs>
    <style>
      /* Hallmark: technical composition with a visible human judgment boundary. */
      :root {
      --ink: #edf2fa;
      --muted: #b3c2d5;
      --paper: #111e30;
      --panel: #1a2b42;
      --line: #53677f;
      --accent: #e6a775;
      --navy: #111e30;
      --white: #edf2fa;
      --pale: #b3c2d5;
      --copper: #e6a775;
        --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        --font-display: Georgia, 'Times New Roman', serif;
      }
      text { font-family: var(--font-body); fill: var(--ink); }
      .display { font-family: var(--font-display); }
      .muted { fill: var(--muted); }
      .accent { fill: var(--accent); }
      .paper { fill: var(--paper); }
      .panel { fill: var(--panel); }
      .navy { fill: var(--navy); }
      .white { fill: var(--white); }
      .pale { fill: var(--pale); }
      .copper { fill: var(--copper); }
      .rule { fill: none; stroke: var(--line); stroke-width: 1; }
      .signal { fill: none; stroke: var(--accent); stroke-width: 2; }
      .bright { fill: none; stroke: var(--copper); stroke-width: 2; }
    </style>
  </defs>
  <rect x="0" y="0" width="360" height="160" class="navy"/>
  <text x="20" y="37" font-size="24" class="white" font-weight="600">Claude Code</text>
  <text x="201" y="37" font-size="24" class="white" font-weight="600">Codex CLI</text>
  <path d="M20 58H340" class="bright"/>
  <text x="20" y="86" font-size="16" class="pale">MCP</text>
  <text x="101" y="86" font-size="16" class="pale">Copilot</text>
  <text x="20" y="119" font-size="17" class="white">multi-agent orchestration</text>
  <text x="20" y="144" font-size="16" class="pale">model routing</text>
</svg>
