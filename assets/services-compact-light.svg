<svg xmlns="http://www.w3.org/2000/svg" width="360" height="152" viewBox="0 0 360 152" role="img" aria-labelledby="title">
  <title id="title">Node, Express, MongoDB, MySQL, SQLite, Supabase, Firebase, Square</title>
  <defs>
    <style>
      /* Hallmark: technical composition with a visible human judgment boundary. */
      :root {
      --ink: #172b46;
      --muted: #495e78;
      --paper: #eef3fa;
      --panel: #e2eaf5;
      --line: #b1c0d2;
      --accent: #99512c;
      --navy: #111e30;
      --white: #edf2fa;
      --pale: #b3c2d5;
      --copper: #e6a775;
        --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        --font-display: Georgia, 'Times New Roman', serif;
      }
      text { font-family: var(--font-body); fill: var(--ink); }
      .display { font-family: var(--font-display); }
      .muted { fill: var(--muted); }
      .accent { fill: var(--accent); }
      .paper { fill: var(--paper); }
      .panel { fill: var(--panel); }
      .navy { fill: var(--navy); }
      .white { fill: var(--white); }
      .pale { fill: var(--pale); }
      .copper { fill: var(--copper); }
      .rule { fill: none; stroke: var(--line); stroke-width: 1; }
      .signal { fill: none; stroke: var(--accent); stroke-width: 2; }
      .bright { fill: none; stroke: var(--copper); stroke-width: 2; }
    </style>
  </defs>
  <rect x="0" y="0" width="360" height="152" class="paper"/>
  <rect x="0" y="0" width="4" height="152" class="accent"/>
  <text x="16" y="37" font-size="25" font-weight="600">Node</text>
  <text x="133" y="37" font-size="25" font-weight="600">Express</text>
  <path d="M16 55H344" class="rule"/>
  <text x="16" y="82" font-size="16" class="muted">MongoDB</text>
  <text x="151" y="82" font-size="16" class="muted">MySQL</text>
  <text x="264" y="82" font-size="16" class="muted">SQLite</text>
  <text x="16" y="125" font-size="16">Supabase</text>
  <text x="151" y="125" font-size="16">Firebase</text>
  <text x="264" y="125" font-size="16">Square</text>
</svg>
