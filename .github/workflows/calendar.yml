name: 3D contribution calendar

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar.yml'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: calendar.yml
  cancel-in-progress: false

jobs:
  render:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate contribution city
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Select the light and dark renders
        run: |
          set -euo pipefail
          test -s profile-3d-contrib/profile-green-animate.svg
          test -s profile-3d-contrib/profile-night-rainbow.svg
          cp profile-3d-contrib/profile-green-animate.svg assets/calendar-light.svg
          cp profile-3d-contrib/profile-night-rainbow.svg assets/calendar-dark.svg
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          for path in ['assets/calendar-light.svg', 'assets/calendar-dark.svg']:
              ET.parse(path)
          PYXML
      - name: Commit generated assets only
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/calendar-light.svg assets/calendar-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh 3d contribution calendar'
          for attempt in 1 2 3; do
            git pull --rebase origin "$DEFAULT_BRANCH"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          exit 1
