name: Profile metrics

on:
  schedule:
    - cron: '57 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metrics.yml'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: metrics.yml
  cancel-in-progress: false

jobs:
  render:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Require the Metrics user token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo '::error::Set the METRICS_TOKEN repository secret before running Metrics. A scope-less personal token is sufficient for these public-profile plugins.'
            exit 1
          fi

      - name: Render public-profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.svg
          output_action: none
          base: header, activity
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Madrid
          config_animations: yes
          config_display: regular
          plugins_errors_fatal: yes
          use_mocked_data: no

      - name: Copy the completed render
        run: |
          set -euo pipefail
          test -s /metrics_renders/metrics.svg
          sudo cp /metrics_renders/metrics.svg assets/metrics.svg
          sudo chown "$(id -u):$(id -g)" assets/metrics.svg
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse('assets/metrics.svg')
          PYXML
      - name: Commit generated assets only
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/metrics.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh profile metrics'
          for attempt in 1 2 3; do
            git pull --rebase origin "$DEFAULT_BRANCH"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          exit 1
