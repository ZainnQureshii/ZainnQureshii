name: Contribution snake

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: snake.yml
  cancel-in-progress: false

jobs:
  render:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate both theme variants
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=#8759d5&color_dots=#ebedf0,#b7f3e9,#65dcc6,#25b49a,#087f6e
            assets/snake-dark.svg?palette=github-dark&color_snake=#f98bc4&color_dots=#25243d,#254e55,#287f81,#39b9ab,#66f0ce
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check generated files
        run: |
          test -s assets/snake-light.svg
          test -s assets/snake-dark.svg
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          for path in ['assets/snake-light.svg', 'assets/snake-dark.svg']:
              ET.parse(path)
          PYXML
      - name: Commit generated assets only
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/snake-light.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh contribution snake'
          for attempt in 1 2 3; do
            git pull --rebase origin "$DEFAULT_BRANCH"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          exit 1
